name: Appetize preview

# Builds the iPhone app for the iOS Simulator and uploads it to Appetize.io, so it can be clicked through in a
# browser (no device needed). One upload, two links:
#   - "Real app" (primary): no launch arguments, so the app runs as the TestFlight build does — the production
#     server (the app's built-in default, genita-api.thebeni.ai), real email-code sign-in, real onboarding and calls.
#   - "Mock": launch argument `--browser-preview` (shared/Call/BrowserPreview.swift) — no server, recorded call replay.
# Appetize itself has no microphone on any platform and no iOS sound output (support.appetize.io), and the simulator
# has no camera: in the real-app link the companion's face moves and captions show, but nobody can speak to it.
#
# Needs the repo secret APPETIZE_API_TOKEN. Without it a run only prints a notice and stops.
# APPETIZE_PUBLIC_KEY (secret or variable) picks the Appetize app to update; without it, the app this workflow
# created on 11/3 is updated, so the link stays the same.

# Manual only (Chelsea 11/3: CI cost) — run it from main once per build (build 3, build 4).
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to Appetize (off = build and check only)
        type: boolean
        default: true

concurrency:
  group: appetize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appetize:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      # not a secret (it is in every link); the fallback is the app the first main run created (11/3)
      APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY || vars.APPETIZE_PUBLIC_KEY || 'bttvcmvd763tor2p4txtmnszlq' }}
    steps:
      - name: Decide what to do
        id: plan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.upload }}" = "false" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "Build and zip only, nothing is uploaded."
          elif [ -z "$APPETIZE_API_TOKEN" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Appetize skipped::The repo secret APPETIZE_API_TOKEN is not set, so nothing was built or uploaded. Add it under Settings > Secrets and variables > Actions, then run this workflow again."
            {
              echo "### Appetize preview skipped"
              echo ""
              echo "The repo secret \`APPETIZE_API_TOKEN\` is not set. Create an Appetize account, copy the API token, add it as the secret, then run this workflow again (Actions > Appetize preview > Run workflow)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.plan.outputs.build == 'true'

      - name: Replay recordings match the call-replay server's
        if: steps.plan.outputs.build == 'true'
        run: |
          cmp ios-app/Tools/call-replay/session-r1.json ios-app/Genita/Resources/preview-session-r1.json
          cmp ios-app/Tools/call-replay/session-int.json ios-app/Genita/Resources/preview-session-int.json

      - name: Select Xcode 26
        if: steps.plan.outputs.build == 'true'
        run: |
          XC="$(ls -d /Applications/Xcode_26.*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      # Release (optimised) for the simulator, the TestFlight configuration. DEBUG is switched on for this build only so
      # the same binary can also open the mock (`--browser-preview`); every DEBUG path is behind a launch argument or a
      # GENITA_* variable, and the real-app link passes none, so it runs the Release code paths. The TestFlight / App
      # Store archive (device-test.yml) is Release without DEBUG.
      # Signed ad hoc ("Sign to Run Locally") with the keychain entitlements: the session token from sign-in lives in
      # the keychain, and an unsigned simulator app has no keychain access group (the UI tests use --stub-signin for
      # that reason). Sign in with Apple is left out: it needs a provisioning profile and an Apple ID on the device.
      # arm64 only: Appetize recommends ARM simulator builds.
      - name: Simulator entitlements (keychain)
        if: steps.plan.outputs.build == 'true'
        run: |
          cat > "$RUNNER_TEMP/simulator.entitlements" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>application-identifier</key>
          	<string>SIMULATOR.ai.thebeni.genita</string>
          	<key>keychain-access-groups</key>
          	<array>
          		<string>SIMULATOR.ai.thebeni.genita</string>
          	</array>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/simulator.entitlements"

      - name: Build for the iOS Simulator
        if: steps.plan.outputs.build == 'true'
        run: |
          xcodebuild build \
            -project ios-app/Genita.xcodeproj -scheme Genita \
            -configuration Release -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG \
            CONFIGURATION_BUILD_DIR="$PWD/build-output/app" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGN_ENTITLEMENTS="$RUNNER_TEMP/simulator.entitlements" | grep -E "error:|warning: unre|\*\* BUILD" | cut -c1-240
          exit "${PIPESTATUS[0]}"

      - name: The app carries the keychain entitlements
        if: steps.plan.outputs.build == 'true'
        run: |
          APP=build-output/app/Genita.app
          codesign -dv "$APP" 2>&1 | grep -E "Identifier|Signature" || true
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | head -c 1200; echo
          # the simulator reads entitlements from the binary's __TEXT,__entitlements section (Xcode writes it for simulator builds)
          otool -l "$APP/Genita" | grep -A1 "sectname __entitlements" || true
          grep -aq "SIMULATOR.ai.thebeni.genita" "$APP/Genita" || { echo "::error title=No keychain entitlement::the binary has no keychain group, sign-in could not keep its session token"; exit 1; }

      # Same signing on a tiny tool run in a booted simulator: a keychain write + read with the app's query
      # (data-protection keychain, as GenitaKit's KeychainTokenStore). Unsigned is logged for comparison only.
      - name: Keychain works on the simulator with this signing
        if: steps.plan.outputs.build == 'true'
        run: |
          D="$RUNNER_TEMP/kc"; mkdir -p "$D"
          cat > "$D/probe.swift" <<'EOF'
          import Foundation
          import Security
          let q: [String: Any] = [kSecClass as String: kSecClassGenericPassword, kSecAttrService as String: "ai.thebeni.genita.probe",
                                  kSecAttrAccount as String: "session", kSecUseDataProtectionKeychain as String: true]
          SecItemDelete(q as CFDictionary)
          var add = q
          add[kSecValueData as String] = Data("token".utf8)
          add[kSecAttrAccessible as String] = kSecAttrAccessibleAfterFirstUnlockThisDeviceOnly
          let added = SecItemAdd(add as CFDictionary, nil)
          var read = q
          read[kSecReturnData as String] = true
          read[kSecMatchLimit as String] = kSecMatchLimitOne
          var out: CFTypeRef?
          let found = SecItemCopyMatching(read as CFDictionary, &out)
          print("SecItemAdd=\(added) SecItemCopyMatching=\(found)")
          exit(added == errSecSuccess && found == errSecSuccess ? 0 : 1)
          EOF
          xcrun -sdk iphonesimulator swiftc -target arm64-apple-ios17.0-simulator "$D/probe.swift" -o "$D/unsigned"
          xcrun -sdk iphonesimulator swiftc -target arm64-apple-ios17.0-simulator "$D/probe.swift" -o "$D/signed" \
            -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __entitlements -Xlinker "$RUNNER_TEMP/simulator.entitlements"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/simulator.entitlements" "$D/signed"
          UDID="$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b >/dev/null
          echo "unsigned: $(xcrun simctl spawn "$UDID" "$D/unsigned" 2>&1 || true)"
          RESULT="$(xcrun simctl spawn "$UDID" "$D/signed" 2>&1)" && STATUS=0 || STATUS=$?
          echo "signed (as the app): $RESULT"
          xcrun simctl shutdown "$UDID" || true
          echo "Keychain on the simulator, signed as the app: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = 0 ] || { echo "::error title=Keychain write failed::$RESULT"; exit 1; }

      - name: Zip the app
        if: steps.plan.outputs.build == 'true'
        run: |
          test -d build-output/app/Genita.app
          lipo -archs build-output/app/Genita.app/Genita
          (cd build-output/app && zip -qry ../Genita-simulator.zip Genita.app)
          ls -l build-output/Genita-simulator.zip

      - name: Keep the zip
        if: steps.plan.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Genita-simulator
          path: build-output/Genita-simulator.zip
          retention-days: 7

      - name: Upload to Appetize
        if: steps.plan.outputs.upload == 'true'
        run: |
          if [ -n "$APPETIZE_PUBLIC_KEY" ]; then
            ENDPOINT="https://api.appetize.io/v1/apps/$APPETIZE_PUBLIC_KEY"
            echo "Updating the existing Appetize app $APPETIZE_PUBLIC_KEY"
          else
            ENDPOINT="https://api.appetize.io/v1/apps"
            echo "No APPETIZE_PUBLIC_KEY: creating a new Appetize app"
          fi
          CODE="$(curl -sS -o appetize-response.json -w '%{http_code}' -X POST "$ENDPOINT" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@build-output/Genita-simulator.zip" \
            -F "platform=ios" \
            --form-string "note=genita ${GITHUB_SHA::7} (${GITHUB_REF_NAME})" \
            -F "timeout=300")"
          if [ "$CODE" != "200" ]; then
            echo "::error title=Appetize upload failed::HTTP $CODE"
            python3 -c "import json,sys; d=json.load(open('appetize-response.json')); d.pop('publicKey', None); print(json.dumps(d)[:600])" 2>/dev/null || head -c 600 appetize-response.json
            exit 1
          fi
          KEY="$(python3 -c "import json; print(json.load(open('appetize-response.json'))['publicKey'])")"
          # grantPermissions: the camera / mic / photos prompts are answered yes (Appetize has neither device anyway)
          BASE="https://appetize.io/app/${KEY}?device=iphone17pro&osVersion=26.0&autoplay=true"
          URL="${BASE}&grantPermissions=true"
          # launchArgs is a URL-encoded JSON array: ["--browser-preview"]
          MOCK_URL="${BASE}&launchArgs=%5B%22--browser-preview%22%5D"
          echo "::notice title=Appetize real app (prod server)::$URL"
          echo "::notice title=Appetize mock (no server)::$MOCK_URL"
          {
            echo "### Appetize preview"
            echo ""
            echo "- Real app, production server: $URL"
            echo "- Mock, no server (recorded call, Preview tab on the right edge): $MOCK_URL"
            echo ""
            echo "Commit \`${GITHUB_SHA::7}\`. Real app: sign in with **Continue with email** (the 6-digit code arrives by email; Sign in with Apple can't run here). Appetize has no microphone and no iOS sound, and the simulator has no camera: a call connects and the face moves, but it can't hear you."
            if [ -z "$APPETIZE_PUBLIC_KEY" ]; then
              echo ""
              echo "**This run created a new Appetize app.** To keep this link for future runs, add its key \`$KEY\` as the repo secret (or variable) \`APPETIZE_PUBLIC_KEY\`. Without it every run creates another app with another link."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
