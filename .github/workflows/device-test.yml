name: Device test builds

# Release builds:
# - iOS: signed Release archive uploaded to TestFlight (internal + external groups).
#   Build number = run_number * 10 + run_attempt, so every run is a new build.
# - Mac: GenitaMac.app (shown as "Genita") signed with Developer ID (hardened runtime), packed in Genita-<version>.dmg,
#   notarized and stapled; artifact "Genita-Mac-dmg". Same build number as iOS.
#   Sparkle auto-update: the DMG is EdDSA-signed (sign_update, key GENITA_SPARKLE_ED_PRIVATE = SSM
#   /genita/apple/sparkle_ed_private) and published with an appcast entry to GitHub Pages
#   (bagel-labs-beni/genita-legal /mac/, deploy key GENITA_UPDATES_DEPLOY_KEY). Installed Macs pick it up
#   at launch / daily and offer "Restart to update". Without those two secrets the publish step is skipped.
# Runs on push to release/** (and ci/testflight), or by hand (workflow_dispatch; inputs below).
# Checklist: ./_qa-scripts/genita-release/RELEASE_CHECKLIST.md (local).
on:
  push:
    branches: [ci/testflight, "release/**"]
  workflow_dispatch:
    inputs:
      ios:
        description: "Build and upload iOS to TestFlight"
        type: boolean
        default: true
      publish_mac_update:
        description: "Publish the Mac DMG to the Sparkle appcast (installed Macs update)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: device-test-${{ github.ref }}
  cancel-in-progress: false

env:
  TEAM_ID: D8456M6DS9
  ASC_KEY_ID: GW2XV9F44Q
  IOS_BUNDLE_ID: ai.thebeni.genita
  IOS_PROFILE_NAME: Genita iOS App Store

jobs:
  ios-testflight:
    if: github.event_name != 'workflow_dispatch' || inputs.ios
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC="$(ls -d /Applications/Xcode_26.*.app | sort -V | tail -1)"
          test -n "$XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Check signing secrets are present
        env:
          ASC_KEY_P8: ${{ secrets.GENITA_ASC_KEY_P8 }}
          ASC_ISSUER_ID: ${{ secrets.GENITA_ASC_ISSUER_ID }}
          DIST_P12: ${{ secrets.GENITA_DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.GENITA_DIST_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.GENITA_IOS_PROFILE_BASE64 }}
        run: |
          missing=0
          for name in ASC_KEY_P8 ASC_ISSUER_ID DIST_P12 DIST_P12_PASSWORD IOS_PROFILE; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret for $name"; missing=1; fi
          done
          exit $missing

      - name: Install distribution certificate and profile
        env:
          DIST_P12: ${{ secrets.GENITA_DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.GENITA_DIST_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.GENITA_IOS_PROFILE_BASE64 }}
          ASC_KEY_P8: ${{ secrets.GENITA_ASC_KEY_P8 }}
          ASC_ISSUER_ID: ${{ secrets.GENITA_ASC_ISSUER_ID }}
        run: |
          umask 077
          KC="$RUNNER_TEMP/genita-signing.keychain-db"
          KC_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KC_PASSWORD"
          printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KC" | grep "Apple Distribution" | sed -E 's/[0-9A-F]{40}/<sha1>/'
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          printf '%s' "$IOS_PROFILE" | base64 --decode > "$RUNNER_TEMP/genita.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/genita.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          # Sign in with Apple needs the entitlement in the profile; a stale secret gets the live profile from ASC.
          if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            echo "::warning::GENITA_IOS_PROFILE_BASE64 lacks Sign in with Apple; fetching the current profile from App Store Connect"
            node .github/device-test/fetch-profile.mjs "$IOS_PROFILE_NAME" "$RUNNER_TEMP/genita.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/genita.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          fi
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin' "$RUNNER_TEMP/profile.plist"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")" = "$IOS_PROFILE_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")" = "$TEAM_ID.$IOS_BUNDLE_ID"
          cp "$RUNNER_TEMP/genita.mobileprovision" "$PROFILES/$UUID.mobileprovision"
          cp "$RUNNER_TEMP/genita.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"
          echo "Profile $IOS_PROFILE_NAME installed, expires $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")"

      - name: Set build number and export compliance
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          PLIST=ios-app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          echo "VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" >> "$GITHUB_ENV"
          echo "Build $BUILD_NUMBER"

      - name: Archive iOS app
        run: |
          xcodebuild archive \
            -project ios-app/Genita.xcodeproj -scheme Genita -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/Genita.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon | grep -E "error:|warning: .*(sign|profile|icon)|\*\* ARCHIVE" | cut -c1-300
          exit "${PIPESTATUS[0]}"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Genita.xcarchive" \
            -exportOptionsPlist .github/device-test/ExportOptions-ios.plist \
            -exportPath "$RUNNER_TEMP/ipa" | tail -n 20
          exit "${PIPESTATUS[0]}"

      - name: Upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.GENITA_ASC_KEY_P8 }}
          ASC_ISSUER_ID: ${{ secrets.GENITA_ASC_ISSUER_ID }}
        run: |
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          IPA="$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)"
          ls -lh "$IPA"
          # Primary path: xcodebuild uploads the signed archive with the API key.
          cp .github/device-test/ExportOptions-ios.plist "$RUNNER_TEMP/upload.plist"
          /usr/libexec/PlistBuddy -c "Set :destination upload" "$RUNNER_TEMP/upload.plist"
          set +e
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Genita.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/upload.plist" -exportPath "$RUNNER_TEMP/upload" \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -n 30
          STATUS="${PIPESTATUS[0]}"
          if [ "$STATUS" != 0 ]; then
            echo "xcodebuild upload failed ($STATUS). Trying altool."
            xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tail -n 30
            STATUS="${PIPESTATUS[0]}"
          fi
          set -e
          rm -f "$KEY"
          if [ "$STATUS" = 0 ]; then
            echo "### TestFlight upload finished: Genita $VERSION ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
            echo "Source commit: $GITHUB_SHA. Apple processing takes about 5 to 20 minutes, then the build appears in the TestFlight app for the internal group." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$STATUS"

      - name: Keep IPA for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genita-ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/genita-signing.keychain-db" 2>/dev/null || true

  mac-app:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SPARKLE_VERSION: "2.10.0"
      SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
      UPDATES_BASE_URL: https://bagel-labs-beni.github.io/genita-legal/mac
      PUBLISH_UPDATE: ${{ github.event_name == 'push' || inputs.publish_mac_update }}
      HAS_UPDATE_SECRETS: ${{ secrets.GENITA_SPARKLE_ED_PRIVATE != '' && secrets.GENITA_UPDATES_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set build number
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "MAC_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' ios-app/Info.plist)" >> "$GITHUB_ENV"

      - name: Select Xcode 26
        run: |
          XC="$(ls -d /Applications/Xcode_26.*.app | sort -V | tail -1)"
          test -n "$XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build GenitaMac (Release, unsigned)
        working-directory: ios-app
        run: |
          xcodebuild -resolvePackageDependencies -project Genita.xcodeproj | tail -n 5
          xcodebuild -project Genita.xcodeproj -target GenitaMac -configuration Release -sdk macosx \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="$MAC_VERSION" | grep -E "error:|\*\* BUILD" | cut -c1-300
          exit "${PIPESTATUS[0]}"

      - name: Check version and Sparkle in the app
        run: |
          APP=ios-app/build/Release/GenitaMac.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Contents/Info.plist")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$MAC_VERSION"
          /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$APP/Contents/Info.plist" > /dev/null
          test -d "$APP/Contents/Frameworks/Sparkle.framework" || { echo "::error::Sparkle.framework is not embedded"; ls -la "$APP/Contents/Frameworks" || true; exit 1; }
          echo "GenitaMac $MAC_VERSION ($BUILD_NUMBER), Sparkle embedded"

      - name: Install Developer ID identity
        id: identity
        env:
          DEVID_P12: ${{ secrets.GENITA_DEVID_P12_BASE64 }}
          DEVID_P12_PASSWORD: ${{ secrets.GENITA_DEVID_P12_PASSWORD }}
        run: |
          if [ -z "$DEVID_P12" ] || [ -z "$DEVID_P12_PASSWORD" ]; then
            echo "::error::Missing GENITA_DEVID_P12_BASE64 / GENITA_DEVID_P12_PASSWORD"
            exit 1
          fi
          umask 077
          KC="$RUNNER_TEMP/genita-devid.keychain-db"
          KC_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KC_PASSWORD"
          printf '%s' "$DEVID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$DEVID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/devid.p12"
          # The chain to Apple's root must be findable, or codesign reports
          # "The specified item could not be found in the keychain".
          for ca in DeveloperIDG2CA DeveloperIDCA AppleWWDRCAG3; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer" \
              && security import "$RUNNER_TEMP/$ca.cer" -k "$KC" -T /usr/bin/codesign >/dev/null 2>&1 || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC" > /dev/null
          # codesign resolves identities and intermediates through the user search list.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KC"
          echo "Identities in the signing keychain (hash hidden):"
          security find-identity -p codesigning "$KC" | sed -E 's/[0-9A-F]{40}/<sha1>/'
          HASH="$(security find-identity -v -p codesigning "$KC" | awk '/"Developer ID Application:/ {print $2; exit}')"
          if [ -z "$HASH" ]; then
            echo "::error::No valid 'Developer ID Application' identity in GENITA_DEVID_P12_BASE64"
            exit 1
          fi
          echo "DEVID_HASH=$HASH" >> "$GITHUB_ENV"
          echo "KC=$KC" >> "$GITHUB_ENV"

      - name: Sign app with Developer ID (hardened runtime)
        run: |
          APP=ios-app/build/Release/GenitaMac.app
          SIGN=(codesign --force --options runtime --timestamp --keychain "$KC" --sign "$DEVID_HASH")
          # Sparkle's helpers first, in Sparkle's documented order (no --deep), then the framework
          SPK="$APP/Contents/Frameworks/Sparkle.framework"
          if [ -d "$SPK" ]; then
            "${SIGN[@]}" "$SPK/Versions/B/XPCServices/Installer.xpc"
            "${SIGN[@]}" --preserve-metadata=entitlements "$SPK/Versions/B/XPCServices/Downloader.xpc"
            "${SIGN[@]}" "$SPK/Versions/B/Autoupdate"
            "${SIGN[@]}" "$SPK/Versions/B/Updater.app"
            "${SIGN[@]}" "$SPK"
          fi
          # inside-out: other nested frameworks, dylibs, helpers, then the app
          find "$APP/Contents" -depth \( -name "*.dylib" -o -name "*.framework" -o -name "*.xpc" -o -name "*.appex" -o -name "*.bundle" \) -not -path "*/Sparkle.framework*" -print0 2>/dev/null |
            while IFS= read -r -d '' item; do
              codesign --force --options runtime --timestamp --keychain "$KC" --sign "$DEVID_HASH" "$item"
            done
          codesign --force --options runtime --timestamp --keychain "$KC" \
            --entitlements .github/device-test/GenitaMac-devid.entitlements \
            --sign "$DEVID_HASH" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "^(Authority|TeamIdentifier|Runtime|Identifier)" || true

      - name: Notarize and staple the app
        # The DMG's ticket stays on the DMG: an app copied to /Applications carries none, so Gatekeeper must reach
        # Apple to open it (offline judge Mac → blocked). Notarize the app itself first and staple it, then pack it.
        env:
          ASC_KEY_P8: ${{ secrets.GENITA_ASC_KEY_P8 }}
          ASC_ISSUER_ID: ${{ secrets.GENITA_ASC_ISSUER_ID }}
        run: |
          APP=ios-app/build/Release/GenitaMac.app
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ZIP="$RUNNER_TEMP/GenitaMac-notarize.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          xcrun notarytool submit "$ZIP" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary-app.json" || true
          cat "$RUNNER_TEMP/notary-app.json"
          read -r STATUS ID < <(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("status","none"), d.get("id","none"))' "$RUNNER_TEMP/notary-app.json" 2>/dev/null || echo "none none")
          if [ "$ID" != "none" ] && [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$ID" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" | head -c 8000 || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$ZIP"
          test "$STATUS" = "Accepted"
          for i in 1 2 3 4; do xcrun stapler staple "$APP" && break; [ "$i" = 4 ] && exit 1; sleep $((i * 15)); done
          xcrun stapler validate "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Build and sign DMG
        run: |
          APP=ios-app/build/Release/GenitaMac.app
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist" 2>/dev/null || echo 0.1)"
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE" build-output
          ditto "$APP" "$STAGE/GenitaMac.app"
          ln -s /Applications "$STAGE/Applications"
          DMG="build-output/Genita-$VERSION.dmg"
          hdiutil create -volname "Genita" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          codesign --force --timestamp --keychain "$KC" --sign "$DEVID_HASH" "$DMG"
          codesign --verify --verbose=2 "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize and staple DMG
        env:
          ASC_KEY_P8: ${{ secrets.GENITA_ASC_KEY_P8 }}
          ASC_ISSUER_ID: ${{ secrets.GENITA_ASC_ISSUER_ID }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          read -r STATUS ID < <(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("status","none"), d.get("id","none"))' "$RUNNER_TEMP/notary.json" 2>/dev/null || echo "none none")
          if [ "$ID" != "none" ]; then
            xcrun notarytool log "$ID" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" | head -c 8000 || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          test "$STATUS" = "Accepted"
          # stapler fetches the ticket from Apple's CDN; retry its network flakes (error 68)
          for i in 1 2 3 4; do xcrun stapler staple "$DMG" && break; [ "$i" = 4 ] && exit 1; sleep $((i * 15)); done
          xcrun stapler validate "$DMG"

      - name: Verify Gatekeeper
        run: |
          spctl -a -t open --context context:primary-signature -v "$DMG"
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG" >/dev/null
          spctl -a -t exec -vv "$MNT/GenitaMac.app"
          codesign --verify --deep --strict "$MNT/GenitaMac.app"
          # the app inside carries its own ticket (opens offline after the copy to /Applications)
          xcrun stapler validate "$MNT/GenitaMac.app"
          # Sparkle compares versions: the shipped app must carry both, equal to this run's numbers
          V="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$MNT/GenitaMac.app/Contents/Info.plist")"
          SV="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$MNT/GenitaMac.app/Contents/Info.plist")"
          echo "DMG app: $SV ($V)"
          # Chelsea 11/4: people see "Genita", never "GenitaMac" (menu bar, About/Quit, Dock, Finder). File name stays (Sparkle).
          N="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$MNT/GenitaMac.app/Contents/Info.plist")"
          DN="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$MNT/GenitaMac.app/Contents/Info.plist")"
          echo "names: CFBundleName=$N CFBundleDisplayName=$DN"
          test "$N" = Genita && test "$DN" = Genita || { echo "::error::visible app name is '$N' / '$DN', not Genita"; hdiutil detach "$MNT" >/dev/null; exit 1; }
          plutil -p "$MNT/GenitaMac.app/Contents/Resources/en.lproj/InfoPlist.strings" | grep -q '"CFBundleDisplayName" => "Genita"' \
            || { echo "::error::en.lproj/InfoPlist.strings (localized display name) missing"; hdiutil detach "$MNT" >/dev/null; exit 1; }
          test "$V" = "$BUILD_NUMBER" && test "$SV" = "$MAC_VERSION" || { echo "::error::DMG Info.plist version $SV ($V) ≠ $MAC_VERSION ($BUILD_NUMBER)"; hdiutil detach "$MNT" >/dev/null; exit 1; }
          # #347: a notarized DMG must also start. Sparkle needs the Frameworks rpath, then a 10 s launch smoke.
          BIN="$MNT/GenitaMac.app/Contents/MacOS/GenitaMac"
          otool -l "$BIN" | grep -A2 LC_RPATH | grep -q "@executable_path/../Frameworks" || { echo "::error::GenitaMac has no @executable_path/../Frameworks rpath (Sparkle won't load)"; hdiutil detach "$MNT" >/dev/null; exit 1; }
          "$BIN" > "$RUNNER_TEMP/launch.log" 2>&1 &
          APP=$!
          sleep 10
          if kill -0 "$APP" 2>/dev/null; then
            kill "$APP" 2>/dev/null || true
            echo "launch smoke: GenitaMac still running after 10 s"
          else
            echo "::error::GenitaMac exited within 10 s of launch"; tail -n 40 "$RUNNER_TEMP/launch.log"; hdiutil detach "$MNT" >/dev/null; exit 1
          fi
          hdiutil detach "$MNT" >/dev/null || { sleep 2; hdiutil detach -force "$MNT" >/dev/null; }
          shasum -a 256 "$DMG"
          {
            echo "### Genita Mac DMG"
            echo "$(basename "$DMG"): Developer ID signed, notarized, stapled (DMG and the app inside). Gatekeeper: accepted."
            echo "SHA-256: $(shasum -a 256 "$DMG" | cut -d' ' -f1)"
            echo "Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sparkle-sign the DMG
        if: env.PUBLISH_UPDATE == 'true' && env.HAS_UPDATE_SECRETS == 'true'
        env:
          SPARKLE_ED_PRIVATE: ${{ secrets.GENITA_SPARKLE_ED_PRIVATE }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xJf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle" bin
          OUT="$(printf '%s' "$SPARKLE_ED_PRIVATE" | "$RUNNER_TEMP/sparkle/bin/sign_update" -f - "$DMG")"
          SIG="$(sed -nE 's/.*edSignature="([^"]+)".*/\1/p' <<< "$OUT")"
          LEN="$(sed -nE 's/.*length="([0-9]+)".*/\1/p' <<< "$OUT")"
          test -n "$SIG" && test -n "$LEN"
          printf '%s' "$SPARKLE_ED_PRIVATE" | "$RUNNER_TEMP/sparkle/bin/sign_update" --verify -f - "$DMG" "$SIG"
          echo "SPARKLE_SIG=$SIG" >> "$GITHUB_ENV"
          echo "SPARKLE_LEN=$LEN" >> "$GITHUB_ENV"

      - name: Check out the updates site
        if: env.PUBLISH_UPDATE == 'true' && env.HAS_UPDATE_SECRETS == 'true'
        uses: actions/checkout@v4
        with:
          repository: bagel-labs-beni/genita-legal
          ssh-key: ${{ secrets.GENITA_UPDATES_DEPLOY_KEY }}
          path: updates-site

      - name: Publish the appcast entry (installed Macs update from here)
        if: env.PUBLISH_UPDATE == 'true' && env.HAS_UPDATE_SECRETS == 'true'
        run: |
          NAME="Genita-Mac-$BUILD_NUMBER.dmg"  # appcast download URL only (appcast.mjs keeps this pattern); Sparkle downloads it silently
          ROOT="$PWD"
          cd updates-site
          git config user.name "genita-release-bot"
          git config user.email "chelsea@users.noreply.github.com"
          # Another branch may publish at the same time: rebuild the entry on the newest site state each try.
          published=0
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p mac && cp "$ROOT/$DMG" "mac/$NAME"
            node "$ROOT/.github/device-test/appcast.mjs" --dir mac --dmg "$NAME" --build "$BUILD_NUMBER" --version "$MAC_VERSION" \
              --signature "$SPARKLE_SIG" --length "$SPARKLE_LEN" --base "$UPDATES_BASE_URL" --commit "$GITHUB_SHA"
            git add -A mac
            git commit -q -m "mac: Genita $MAC_VERSION ($BUILD_NUMBER) from ${GITHUB_SHA::7}"
            if git push -q origin HEAD:main; then published=1; break; fi
            sleep $((i * 5))
          done
          test "$published" = 1 || { echo "::error::could not push the appcast entry after 4 tries"; exit 1; }
          {
            echo "### Sparkle update published"
            echo "Genita $MAC_VERSION ($BUILD_NUMBER) → $UPDATES_BASE_URL/appcast.xml. Pages deploys in about a minute; installed Macs see it at next launch or daily check."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update publish skipped
        if: env.PUBLISH_UPDATE == 'true' && env.HAS_UPDATE_SECRETS != 'true'
        run: echo "::warning::GENITA_SPARKLE_ED_PRIVATE / GENITA_UPDATES_DEPLOY_KEY not set — DMG built but not published to the Sparkle appcast (run ./_qa-scripts/genita-release/sparkle-setup.sh once)"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Genita-Mac-dmg
          path: build-output/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing keychain
        if: always()
        run: |
          security list-keychains -d user -s login.keychain-db 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/genita-devid.keychain-db" 2>/dev/null || true
