name: Device test builds

# Release builds:
# - iOS: signed Release archive uploaded to TestFlight (internal + external groups).
#   Build number = run_number * 10 + run_attempt, so every run is a new build.
# - Mac: GenitaMac.app signed with Developer ID (hardened runtime), packed in a DMG,
#   notarized and stapled; artifact "Genita-Mac-dmg".
# Runs on push to release/** (and ci/testflight), or by hand (workflow_dispatch).
# Checklist: ./_qa-scripts/genita-release/RELEASE_CHECKLIST.md (local).
on:
  push:
    branches: [ci/testflight, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-test-${{ github.ref }}
  cancel-in-progress: false

env:
  TEAM_ID: D8456M6DS9
  ASC_KEY_ID: GW2XV9F44Q
  IOS_BUNDLE_ID: ai.thebeni.genita
  IOS_PROFILE_NAME: Genita iOS App Store

jobs:
  ios-testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC="$(ls -d /Applications/Xcode_26.*.app | sort -V | tail -1)"
          test -n "$XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Check signing secrets are present
        env:
          ASC_KEY_P8: ${{ secrets.GENITA_ASC_KEY_P8 }}
          ASC_ISSUER_ID: ${{ secrets.GENITA_ASC_ISSUER_ID }}
          DIST_P12: ${{ secrets.GENITA_DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.GENITA_DIST_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.GENITA_IOS_PROFILE_BASE64 }}
        run: |
          missing=0
          for name in ASC_KEY_P8 ASC_ISSUER_ID DIST_P12 DIST_P12_PASSWORD IOS_PROFILE; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret for $name"; missing=1; fi
          done
          exit $missing

      - name: Install distribution certificate and profile
        env:
          DIST_P12: ${{ secrets.GENITA_DIST_P12_BASE64 }}
          DIST_P12_PASSWORD: ${{ secrets.GENITA_DIST_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.GENITA_IOS_PROFILE_BASE64 }}
          ASC_KEY_P8: ${{ secrets.GENITA_ASC_KEY_P8 }}
          ASC_ISSUER_ID: ${{ secrets.GENITA_ASC_ISSUER_ID }}
        run: |
          umask 077
          KC="$RUNNER_TEMP/genita-signing.keychain-db"
          KC_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KC_PASSWORD"
          printf '%s' "$DIST_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/dist.p12" -k "$KC" -P "$DIST_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KC" | grep "Apple Distribution" | sed -E 's/[0-9A-F]{40}/<sha1>/'
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          printf '%s' "$IOS_PROFILE" | base64 --decode > "$RUNNER_TEMP/genita.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/genita.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          # Sign in with Apple needs the entitlement in the profile; a stale secret gets the live profile from ASC.
          if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            echo "::warning::GENITA_IOS_PROFILE_BASE64 lacks Sign in with Apple; fetching the current profile from App Store Connect"
            node .github/device-test/fetch-profile.mjs "$IOS_PROFILE_NAME" "$RUNNER_TEMP/genita.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/genita.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          fi
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.applesignin' "$RUNNER_TEMP/profile.plist"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")" = "$IOS_PROFILE_NAME"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")" = "$TEAM_ID.$IOS_BUNDLE_ID"
          cp "$RUNNER_TEMP/genita.mobileprovision" "$PROFILES/$UUID.mobileprovision"
          cp "$RUNNER_TEMP/genita.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"
          echo "Profile $IOS_PROFILE_NAME installed, expires $(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")"

      - name: Set build number and export compliance
        run: |
          BUILD_NUMBER=$(( ${{ github.run_number }} * 10 + ${{ github.run_attempt }} ))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          PLIST=ios-app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          echo "VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" >> "$GITHUB_ENV"
          echo "Build $BUILD_NUMBER"

      - name: Archive iOS app
        run: |
          xcodebuild archive \
            -project ios-app/Genita.xcodeproj -scheme Genita -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/Genita.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon | grep -E "error:|warning: .*(sign|profile|icon)|\*\* ARCHIVE" | cut -c1-300
          exit "${PIPESTATUS[0]}"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Genita.xcarchive" \
            -exportOptionsPlist .github/device-test/ExportOptions-ios.plist \
            -exportPath "$RUNNER_TEMP/ipa" | tail -n 20
          exit "${PIPESTATUS[0]}"

      - name: Upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.GENITA_ASC_KEY_P8 }}
          ASC_ISSUER_ID: ${{ secrets.GENITA_ASC_ISSUER_ID }}
        run: |
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          IPA="$(ls "$RUNNER_TEMP"/ipa/*.ipa | head -1)"
          ls -lh "$IPA"
          # Primary path: xcodebuild uploads the signed archive with the API key.
          cp .github/device-test/ExportOptions-ios.plist "$RUNNER_TEMP/upload.plist"
          /usr/libexec/PlistBuddy -c "Set :destination upload" "$RUNNER_TEMP/upload.plist"
          set +e
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Genita.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/upload.plist" -exportPath "$RUNNER_TEMP/upload" \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -n 30
          STATUS="${PIPESTATUS[0]}"
          if [ "$STATUS" != 0 ]; then
            echo "xcodebuild upload failed ($STATUS). Trying altool."
            xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tail -n 30
            STATUS="${PIPESTATUS[0]}"
          fi
          set -e
          rm -f "$KEY"
          if [ "$STATUS" = 0 ]; then
            echo "### TestFlight upload finished: Genita $VERSION ($BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
            echo "Source commit: $GITHUB_SHA. Apple processing takes about 5 to 20 minutes, then the build appears in the TestFlight app for the internal group." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$STATUS"

      - name: Keep IPA for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genita-ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/genita-signing.keychain-db" 2>/dev/null || true

  mac-app:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC="$(ls -d /Applications/Xcode_26.*.app | sort -V | tail -1)"
          test -n "$XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build GenitaMac (Release, unsigned)
        working-directory: ios-app
        run: |
          xcodebuild -project Genita.xcodeproj -target GenitaMac -configuration Release -sdk macosx \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO | grep -E "error:|\*\* BUILD" | cut -c1-300
          exit "${PIPESTATUS[0]}"

      - name: Install Developer ID identity
        id: identity
        env:
          DEVID_P12: ${{ secrets.GENITA_DEVID_P12_BASE64 }}
          DEVID_P12_PASSWORD: ${{ secrets.GENITA_DEVID_P12_PASSWORD }}
        run: |
          if [ -z "$DEVID_P12" ] || [ -z "$DEVID_P12_PASSWORD" ]; then
            echo "::error::Missing GENITA_DEVID_P12_BASE64 / GENITA_DEVID_P12_PASSWORD"
            exit 1
          fi
          umask 077
          KC="$RUNNER_TEMP/genita-devid.keychain-db"
          KC_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KC_PASSWORD"
          printf '%s' "$DEVID_P12" | base64 --decode > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/devid.p12" -k "$KC" -P "$DEVID_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/devid.p12"
          # The chain to Apple's root must be findable, or codesign reports
          # "The specified item could not be found in the keychain".
          for ca in DeveloperIDG2CA DeveloperIDCA AppleWWDRCAG3; do
            curl -fsSL "https://www.apple.com/certificateauthority/$ca.cer" -o "$RUNNER_TEMP/$ca.cer" \
              && security import "$RUNNER_TEMP/$ca.cer" -k "$KC" -T /usr/bin/codesign >/dev/null 2>&1 || true
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC" > /dev/null
          # codesign resolves identities and intermediates through the user search list.
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KC"
          echo "Identities in the signing keychain (hash hidden):"
          security find-identity -p codesigning "$KC" | sed -E 's/[0-9A-F]{40}/<sha1>/'
          HASH="$(security find-identity -v -p codesigning "$KC" | awk '/"Developer ID Application:/ {print $2; exit}')"
          if [ -z "$HASH" ]; then
            echo "::error::No valid 'Developer ID Application' identity in GENITA_DEVID_P12_BASE64"
            exit 1
          fi
          echo "DEVID_HASH=$HASH" >> "$GITHUB_ENV"
          echo "KC=$KC" >> "$GITHUB_ENV"

      - name: Sign app with Developer ID (hardened runtime)
        run: |
          APP=ios-app/build/Release/GenitaMac.app
          # inside-out: nested frameworks, dylibs, helpers first, then the app
          find "$APP/Contents" -depth \( -name "*.dylib" -o -name "*.framework" -o -name "*.xpc" -o -name "*.appex" -o -name "*.bundle" \) -print0 2>/dev/null |
            while IFS= read -r -d '' item; do
              codesign --force --options runtime --timestamp --keychain "$KC" --sign "$DEVID_HASH" "$item"
            done
          codesign --force --options runtime --timestamp --keychain "$KC" \
            --entitlements .github/device-test/GenitaMac-devid.entitlements \
            --sign "$DEVID_HASH" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "^(Authority|TeamIdentifier|Runtime|Identifier)" || true

      - name: Build and sign DMG
        run: |
          APP=ios-app/build/Release/GenitaMac.app
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist" 2>/dev/null || echo 0.1)"
          STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$STAGE" build-output
          ditto "$APP" "$STAGE/GenitaMac.app"
          ln -s /Applications "$STAGE/Applications"
          DMG="build-output/Genita-Mac-$VERSION.dmg"
          hdiutil create -volname "Genita" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          codesign --force --timestamp --keychain "$KC" --sign "$DEVID_HASH" "$DMG"
          codesign --verify --verbose=2 "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Notarize and staple DMG
        env:
          ASC_KEY_P8: ${{ secrets.GENITA_ASC_KEY_P8 }}
          ASC_ISSUER_ID: ${{ secrets.GENITA_ASC_ISSUER_ID }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          read -r STATUS ID < <(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("status","none"), d.get("id","none"))' "$RUNNER_TEMP/notary.json" 2>/dev/null || echo "none none")
          if [ "$ID" != "none" ]; then
            xcrun notarytool log "$ID" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" | head -c 8000 || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          test "$STATUS" = "Accepted"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Verify Gatekeeper
        run: |
          spctl -a -t open --context context:primary-signature -v "$DMG"
          MNT="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG" >/dev/null
          spctl -a -t exec -vv "$MNT/GenitaMac.app"
          codesign --verify --deep --strict "$MNT/GenitaMac.app"
          hdiutil detach "$MNT" >/dev/null
          shasum -a 256 "$DMG"
          {
            echo "### Genita Mac DMG"
            echo "$(basename "$DMG"): Developer ID signed, notarized, stapled. Gatekeeper: accepted."
            echo "SHA-256: $(shasum -a 256 "$DMG" | cut -d' ' -f1)"
            echo "Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Genita-Mac-dmg
          path: build-output/*.dmg
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing keychain
        if: always()
        run: |
          security list-keychains -d user -s login.keychain-db 2>/dev/null || true
          security delete-keychain "$RUNNER_TEMP/genita-devid.keychain-db" 2>/dev/null || true
