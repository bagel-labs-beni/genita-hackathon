name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks 8.30.1
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          destination="$RUNNER_TEMP/gitleaks"
          mkdir -p "$destination"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          tar --extract --gzip --file "$archive" --directory "$destination" gitleaks
          "$destination/gitleaks" version

      - name: Scan Git history and checkout
        run: |
          set -euo pipefail
          gitleaks="$RUNNER_TEMP/gitleaks/gitleaks"
          "$gitleaks" git --redact --config .gitleaks.toml --log-opts="--all" .
          "$gitleaks" dir --redact --config .gitleaks.toml .
