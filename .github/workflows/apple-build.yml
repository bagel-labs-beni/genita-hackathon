name: Apple build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/apple-build.yml"
      - "ios-app/**"
      - "mac-app/**"
      - "shared/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/apple-build.yml"
      - "ios-app/**"
      - "mac-app/**"
      - "shared/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apple:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      # The apps use no Git LFS files, so LFS objects are not downloaded.
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC="$(ls -d /Applications/Xcode_26.*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Browser-preview call recordings match the call-replay server's
        run: |
          cmp ios-app/Tools/call-replay/session-r1.json ios-app/Genita/Resources/preview-session-r1.json
          cmp ios-app/Tools/call-replay/session-int.json ios-app/Genita/Resources/preview-session-int.json

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = [d for runtime, group in json.load(sys.stdin)["devices"].items() if "iOS-26" in runtime for d in group if d["name"].startswith("iPhone")]
          pro = [d for d in devices if re.fullmatch(r"iPhone \d+ Pro", d["name"])]
          print((pro or devices)[-1]["udid"])')"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$ID"

      - name: iOS simulator build and tests
        run: |
          xcodebuild test \
            -project ios-app/Genita.xcodeproj -scheme Genita \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -only-testing:GenitaTests \
            -only-testing:GenitaUITests/HandoffScreensUITests \
            -only-testing:GenitaUITests/GenitaUITests/testReviewCorrections \
            -only-testing:GenitaUITests/BrowserPreviewUITests \
            -resultBundlePath build-output/ios.xcresult \
            CODE_SIGNING_ALLOWED=NO | grep -E "^Test Suite|^Test Case .*(passed|failed)|Executed [0-9]+ test|error:|\*\* (TEST|BUILD)" | cut -c1-240
          exit "${PIPESTATUS[0]}"

      - name: Export iOS screenshots
        if: always()
        run: |
          if [ -d build-output/ios.xcresult ]; then
            mkdir -p build-output/raw build-output/screens
            xcrun xcresulttool export attachments --path build-output/ios.xcresult --output-path build-output/raw
            python3 - <<'PY'
          import json, pathlib, shutil
          raw = pathlib.Path("build-output/raw"); screens = pathlib.Path("build-output/screens")
          for test in json.loads((raw / "manifest.json").read_text()):
              for item in test["attachments"]:
                  name = item["suggestedHumanReadableName"].split("_")[0]
                  if name.startswith(("R1", "E0", "P0", "MV", "PROX", "menu-", "pairing-", "conversation-", "preview-")):
                      shutil.copy(raw / item["exportedFileName"], screens / f"{name}.png")
          PY
            ls build-output/screens
          fi

      # I03 live soul orb: ~9 s simulator video + the app's own fps / GPU-time log (GENITA_ORB_STATS=1)
      - name: Record the I03 orb
        if: always()
        continue-on-error: true
        timeout-minutes: 4
        run: |
          t() { perl -e 'alarm shift; exec @ARGV' "$@"; }  # every simctl call is bounded
          SIM="${{ steps.simulator.outputs.id }}"
          APP="$(find ~/Library/Developer/Xcode/DerivedData -maxdepth 6 -path '*Debug-iphonesimulator/Genita.app' | head -1)"
          [ -n "$APP" ] || { echo "no app build"; exit 0; }
          BID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          mkdir -p build-output/screens
          t 60 xcrun simctl bootstatus "$SIM" -b || true
          t 60 xcrun simctl install "$SIM" "$APP"
          SIMCTL_CHILD_GENITA_REVIEW_STAGE=preparing SIMCTL_CHILD_GENITA_ORB_STATS=1 SIMCTL_CHILD_GENITA_SERVER_URL=ws://127.0.0.1:9/v1/session \
            t 60 xcrun simctl launch --terminate-running-process "$SIM" "$BID" --uitesting
          sleep 6
          xcrun simctl io "$SIM" recordVideo --codec=h264 --force build-output/screens/i03-live-orb.mp4 > /dev/null 2>&1 &
          REC=$!
          sleep 9
          pkill -INT -f "simctl io $SIM recordVideo" || kill -INT "$REC" || true
          for _ in $(seq 1 20); do kill -0 "$REC" 2>/dev/null || break; sleep 1; done
          kill -9 "$REC" 2>/dev/null || true
          DATA="$(t 30 xcrun simctl get_app_container "$SIM" "$BID" data || true)"
          [ -n "$DATA" ] && cp "$DATA/tmp/soul-orb-stats.txt" build-output/screens/ || true
          cat build-output/screens/soul-orb-stats.txt || true
          ls -la build-output/screens/i03-live-orb.mp4 || true

      - name: Mac build
        working-directory: ios-app
        run: |
          xcodebuild -project Genita.xcodeproj -target GenitaMac -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO | tail -n 60
          exit "${PIPESTATUS[0]}"

      - name: Capture Mac waiting screens
        continue-on-error: true
        run: |
          GENITA_MAC_REVIEW_OUT="$PWD/build-output/screens" ios-app/build/Debug/GenitaMac.app/Contents/MacOS/GenitaMac &
          APP=$!
          for _ in $(seq 1 30); do kill -0 "$APP" 2>/dev/null || break; sleep 2; done
          kill "$APP" 2>/dev/null || true
          ls build-output/screens

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handoff-screens
          path: build-output/screens
          if-no-files-found: warn
