name: Interpretation

# F8-L1 / F8-L4 / F8-U-INT: server unit tests, GenitaKit tests (+ rendered INT screens),
# and the iPhone interpretation states on the real call screen, driven by a recorded
# interpret session (ios-app/Tools/call-replay/session-int.json). Screens are uploaded.
on:
  pull_request:
    paths:
      - ".github/workflows/interpret.yml"
      - "genita-server/**"
      - "ios-app/**"
      - "mac-app/**"
      - "shared/**"
  workflow_dispatch:

concurrency:
  group: interpret-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: genita-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      # interpretation + the protocol/session tests it touches; the full suite runs in the server-core PR
      - run: node --experimental-strip-types --no-warnings=ExperimentalWarning --test test/interpret.test.ts test/protocol.test.ts test/session.test.ts test/turn-machine.test.ts

  apple:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XC="$(ls -d /Applications/Xcode_26.*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: GenitaKit tests + rendered INT screens
        working-directory: shared/GenitaKit
        run: GENITA_INTERPRET_SHOTS="$GITHUB_WORKSPACE/build-output/rendered" swift test 2>&1 | tail -40

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          ID="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = [d for runtime, group in json.load(sys.stdin)["devices"].items() if "iOS-26" in runtime for d in group if d["name"].startswith("iPhone")]
          pro = [d for d in devices if re.fullmatch(r"iPhone \d+ Pro", d["name"])]
          print((pro or devices)[-1]["udid"])')"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Start the interpret replay server
        run: |
          node ios-app/Tools/call-replay/server.mjs --port 8789 --file ios-app/Tools/call-replay/session-int.json --pace 4 > replay.log 2>&1 &
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:8789/healthz && break; sleep 0.5; done

      - name: iOS interpretation states
        run: |
          xcodebuild test \
            -project ios-app/Genita.xcodeproj -scheme Genita \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -only-testing:GenitaUITests/InterpretScreenUITests \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath build-output/ios-int.xcresult \
            CODE_SIGNING_ALLOWED=NO | grep -E "^Test Suite|^Test Case .*(passed|failed|skipped)|Executed [0-9]+ test|error:|\*\* (TEST|BUILD)" | cut -c1-240
          exit "${PIPESTATUS[0]}"

      - name: Replay log
        if: always()
        run: cat replay.log || true

      - name: Export screens
        if: always()
        run: |
          mkdir -p build-output/screens
          if [ -d build-output/ios-int.xcresult ]; then
            mkdir -p build-output/raw
            xcrun xcresulttool export attachments --path build-output/ios-int.xcresult --output-path build-output/raw
            python3 - <<'PY'
          import json, pathlib, shutil
          raw = pathlib.Path("build-output/raw"); screens = pathlib.Path("build-output/screens")
          for test in json.loads((raw / "manifest.json").read_text()):
              for item in test["attachments"]:
                  name = item["suggestedHumanReadableName"].split("_")[0]
                  if name.startswith("int-"):
                      shutil.copy(raw / item["exportedFileName"], screens / f"{name}.png")
          PY
          fi
          cp build-output/rendered/*.png build-output/screens/ 2>/dev/null || true
          ls build-output/screens

      - name: Mac build
        working-directory: ios-app
        run: |
          xcodebuild -project Genita.xcodeproj -target GenitaMac -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO | grep -E "error:|warning: .*(Interpret|shared/Call)|\*\* BUILD" | cut -c1-240
          exit "${PIPESTATUS[0]}"

      - name: Upload screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interpret-screens
          path: build-output/screens
          if-no-files-found: warn
