name: GATE-I forbidden words

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check added forbidden words
        run: node scripts/gate-i-words.mjs --diff origin/${{ github.base_ref }}

  main-report:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # TODO: Make this blocking after #188 and its follow-up delete merge.
      - name: Report all forbidden words
        continue-on-error: true
        run: node scripts/gate-i-words.mjs
